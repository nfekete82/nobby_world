name: Nobby World magic and browser acceptance

on:
  push:
    branches:
      - feat/tiny-swords-art-direction
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'package*.json'
      - '.github/workflows/nobby-magic.yml'

jobs:
  game-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Real browser mage battle (click -> ack -> HP -> aggro)
        run: npm run test:spell
      - name: Real browser click-to-move
        run: npm run test:click
