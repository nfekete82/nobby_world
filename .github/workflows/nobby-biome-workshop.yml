name: Nobby World biome workshop

on:
  pull_request:
    branches:
      - feat/player-level-progression
      - feat/shaman-biome-expansion
  push:
    branches:
      - feat/player-level-progression
      - feat/shaman-biome-expansion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run map, art and gameplay regression tests
        run: npm test
      - name: Build browser game
        run: npm run build
      - name: Install Chromium for in-game editor test
        run: npx playwright install --with-deps chromium
      - name: Exercise in-game editor
        env:
          CI: 'true'
        run: npm run test:web-editor
      - name: Exercise classes, summons, combat, biomes and touch
        env:
          CI: 'true'
        run: npm run test:expansion
      - name: Exercise closest hostile selection and native skeleton death
        env:
          CI: 'true'
        run: npm run test:aggro

      - name: Upload editor review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-editor-review
          path: artifacts/editor-workshop/
          if-no-files-found: ignore
