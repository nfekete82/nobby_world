name: nobby-world
services:
  # Nobby World Studio: game, editors, live previews and durable authoring.
  game:
    image: node:24-alpine
    restart: unless-stopped
    init: true
    working_dir: /app
    environment:
      NOBBY_EDITOR_READ_ONLY: "0"
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./:/app
      - nobby_world_studio_modules:/app/node_modules
    command:
      - sh
      - -ec
      - |
        lock_hash="$$(sha256sum package-lock.json | cut -d ' ' -f 1)"
        if [ "$$(cat node_modules/.nobby-lock 2>/dev/null || true)" != "$$lock_hash" ]; then
          npm ci
          echo "$$lock_hash" > node_modules/.nobby-lock
        fi
        exec npm run dev -- --host 0.0.0.0 --port 8088 --strictPort
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8088/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  nobby_world_studio_modules:
